name: keepalive

# Keeps the Supabase free-plan project from pausing, and fails loudly the moment
# the data path stops answering. The reasoning, and the month-long outage that
# prompted it, are documented in scripts/keepalive.py.
#
# TRAP: GitHub disables scheduled workflows after 60 days with no repository
# activity. If this repo goes quiet the cron stops, nothing announces it, and
# the project pauses roughly a week later -- the same outage arriving silently
# by a different route. Any push re-enables it; a calendar reminder is the only
# real guard, because the thing that would have warned you is the thing that
# died.

on:
  schedule:
    # Daily at 07:41 UTC NOMINAL -- which is not when it runs. Measured against
    # this repo's other scheduled workflow (site.yml, cron '17 6 * * 1'), the six
    # most recent scheduled runs started 6.4 to 8.5 hours after their nominal
    # time: 06:17 produced 12:40, 12:55, 12:55, 13:58, 14:03 and 14:48. GitHub
    # queues scheduled events and this repo sits deep in that queue, so expect
    # this job somewhere around 14:00-16:00 UTC. DO NOT read a missing run at
    # 07:41 as a failure -- that cost one investigation already.
    #
    # Which minute is therefore nearly irrelevant. An earlier version of this
    # comment claimed the slot was picked to dodge the top-of-hour rush; the
    # measurement above does not support that, and it is deleted rather than
    # softened. It also does not matter: the pause threshold is 7 days of low
    # activity, so a daily run drifting by hours clears it with room to spare.
    # UTC, like every GitHub cron.
    - cron: '41 7 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    # `vars.X || secrets.X` on the non-secret names: Variables and Secrets are
    # separate stores, and reading the wrong one yields an empty string rather
    # than an error. That has already cost this repo a red build.
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SITE_URL: ${{ vars.SITE_URL || secrets.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Stdlib only, so there is nothing to install.
      - run: python3 scripts/keepalive.py
